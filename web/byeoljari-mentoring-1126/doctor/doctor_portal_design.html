function calls(){let L=Object.entries(CALLS).filter(([k,c])=>c.open===tabOpen&&k.includes(qv));if(sortU)L.sort((a,b)=>(b[1].u|0)-(a[1].u|0));
 $('calls').innerHTML=(L.length?'':'<div class="note" style="text-align:center;padding:16px">맞는 호출이 없어요</div>')+L.map(([k,c])=>`<button class="call${k===sel?' on':''}" data-k="${k}"><div class="r1"><span class="org">혜진원</span><span class="t">${c.t}</span></div><div class="nm">${k} <small>(${c.sex} · 만 ${c.age}세) · ${c.cls}</small></div><div class="r3">${c.u?'<span class="chip u">긴급</span>':'<span class="chip n">일반 의뢰</span>'}<span class="tp${c.u?' r':''}">${F(c.v)}°C</span>${(!c.done&&c.open&&!(c.ev||[]).some(e=>e.k==='me'))?'<span class="chip w">내 답 대기</span><span class="tag" style="margin:0">제안</span>':''}</div><div class="msg">${c.msg}</div><div class="by">${c.by}</div></button>`).join('');
 $('tO').setAttribute('aria-pressed',tabOpen);$('tC').setAttribute('aria-pressed',!tabOpen);
 document.querySelectorAll('.call').forEach(b=>b.onclick=()=>{sel=b.dataset.k;openChat=sel;all()})}
function chats(){$('chats').innerHTML=Object.entries(CALLS).map(([k,c])=>{const on=k===openChat;
 let b='';if(on){b=`<div class="cb"><div class="chips"><button data-vc="${k}" type="button">${c.u?'화상 진료 11/20 10:20':'화상 진료 예약'}</button><button data-vt="${k}" type="button">+ 바이탈 첨부</button><button data-h="${k}" type="button">투약 이력</button></div><div class="msgs">`+
  (k==='이서준'?`<div class="me2">혈압 및 산소포화도(SpO2) 추가 측정 부탁드립니다. 10시 20분 비대면 화상 진료 즉시 연결 후 전자처방전 발급하겠습니다. 아세트아미노펜 단일제 원내 비축분 준비해 주세요.</div><div class="sys">촉탁의 강다혜 님이 비대면 진단 대기실에 입장하셨습니다</div><div class="ot"><div class="ab">박</div><div class="q"><small>박소연 수석간호사 10:19</small>아세트아미노펜 원내 비축분 준비해 두었습니다. 화상 진료 대기하겠습니다.</div></div><div class="ot"><div class="ab">박</div><div class="q"><small>박소연 수석간호사 13:47</small>감기증세있습니다. 진료 요청드려요</div></div><div class="sys">강다혜 촉탁의 (원장)이 전자처방전을 발행했어요 (Rx#88124)</div>`:
  k==='김민준'?`<div class="vit"><div class="h"><span>시스템 자동 첨부 · 실시간 활력징후</span><span>13:50 전송</span></div><div class="v"><span>거주인: 김민준 (남, 만 19세)<br><small>평소 기저체온: 36.5°C</small></span><span style="text-align:right"><b>36.5°C</b><br><small>+0.0°C 평소 범위</small></span></div><small>측정 13:50 · 기록 김하늘 선생님</small></div><div class="sys">박소연 수석간호사가 강다혜 촉탁의(원장)에게 김민준 별님 호출을 보냈어요</div>`:
  `<div class="ot"><div class="ab">박</div><div class="q"><small>박소연 수석간호사 14:14</small>오른쪽 팔꿈치에 긁힌 상처가 붉게 부어 있습니다.</div></div>`)+(c.ev||[]).map(e=>e.k==='me'?`<div class="me2">${esc(e.t)}</div>`:e.k==='sys'?`<div class="sys">${esc(e.t)}</div>`:`<div class="vit"><div class="h"><span>시스템 자동 첨부 · 실시간 활력징후</span><span>${e.tm} 전송</span></div><div class="v"><span>거주인: ${k} (${c.sex}, 만 ${c.age}세)${k==='김민준'?'<br><small>평소 기저체온: 36.5°C</small>':''}</span><span style="text-align:right"><b>${F(c.v)}°C</b>${k==='김민준'?'<br><small>+0.0°C 평소 범위</small>':''}</span></div><small>측정 ${e.tm}</small></div>`).join('')+
  `</div><div class="inp"><input aria-label="메시지" placeholder="${k} 별님 건으로 보낼 메시지"><button type="button">전송 ➤</button></div></div>`}
 return `<div class="crow${on?' on':''}"><button class="h" data-c="${k}" aria-expanded="${on}"><span class="ab">${k[0]}</span><span class="x1"><b>${k} 별님</b><small>혜진원 · ${c.cls.replace(' ','·')}</small><div>${c.last}</div></span><span class="ts">${c.chat}</span></button>${b}</div>`}).join('');
 document.querySelectorAll('.crow>.h').forEach(b=>b.onclick=()=>{openChat=openChat===b.dataset.c?'':b.dataset.c;chats()});
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>hist(b.dataset.h));
 const keep=()=>{const m=document.querySelector('.crow.on .msgs');if(m)m.scrollTop=m.scrollHeight};
 document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=()=>{const c=CALLS[b.dataset.vc];if(!c.vc){c.vc=1;(c.ev=c.ev||[]).push({k:'sys',t:'촉탁의 강다혜 님이 비대면 진단 대기실에 입장하셨습니다'});c.last='촉탁의 강다혜 님이 비대면 진단 대기실에 입장하셨습니다';c.chat=md();chats();calls();keep()}});
 document.querySelectorAll('[data-vt]').forEach(b=>b.onclick=()=>{const c=CALLS[b.dataset.vt];(c.ev=c.ev||[]).push({k:'vit',tm:hm()});chats();keep()});
 const bx=document.querySelector('.crow.on .inp');if(bx){const i=bx.querySelector('input'),k=openChat,c=CALLS[k],ms=document.querySelector('.crow.on .msgs');ms.scrollTop=ms.scrollHeight;
  const go=()=>{const v=i.value.trim();if(!v)return;(c.ev=c.ev||[]).push({k:'me',t:v});c.last=v;c.chat=md();chats();calls();const n=document.querySelector('.crow.on .inp input');if(n)n.focus();const m2=document.querySelector('.crow.on .msgs');if(m2)m2.scrollTop=m2.scrollHeight};
  bx.querySelector('button').onclick=go;i.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go()}}}}
function panel(){const c=CALLS[sel];const done=c.done;
 const dr=c.dr=c.dr||{code:'',name:'',memo:'',rx:[['','','']]};
 const tg='<span class="tag">제안</span>';
 const sb=`<div class="pbox"><h3>호출 한눈에 (상황·배경·요청)${tg}</h3><div class="srow"><b>상황</b><span>${sel} 별님 (${c.sex} · 만 ${c.age}세) · ${c.u?'긴급':'일반 의뢰'} · 체온 ${F(c.v)}°C · ${c.t} · ${c.by}</span></div><div class="srow"><b>배경</b><span>상시 복약: ${c.hist.reg||'등록 없음'}<br>필요시 지시: ${c.hist.prn||'등록 없음'}<br>${c.warn}</span></div><div class="srow"><b>요청</b><span>${c.msg}</span></div><div class="note" style="margin-top:6px">호출 때 간호사가 보낸 글과 등록된 기록을 그대로 모은 것이에요. 앱이 평가나 권고를 덧붙이지 않아요.</div></div>`;
 const m=s=>{const x=s.match(/(\d+):(\d+)\s*$/);return x?(+x[1])*60+(+x[2]):0};
 let el='';if(done){const d=m(c.rxno)-m(c.t);el=`<div class="el">접수 ${c.t.match(/\d+:\d+$/)[0]} → 발행 ${c.rxno.match(/\d+:\d+$/)[0]} · ${Math.floor(d/60)?Math.floor(d/60)+'시간 ':''}${d%60}분 ${tg}</div>`}
 const pre=done?'':`<div class="pbox"><h3>발행 전 확인${tg}</h3><div class="chk"><b>등록된 금기</b><span>${c.warn.replace('처방 주의: ','')}</span></div><div class="chk"><b>상시 복약</b><span>${c.hist.reg||'등록 없음'}</span></div><div class="chk"><b>필요시 지시</b><span>${c.hist.prn||'등록 없음'}</span></div><div class="chk"><b>처방 품목</b><span id="prn">${dr.rx.filter(r=>r[0].trim()).length?dr.rx.filter(r=>r[0].trim()).length+'개':'아직 없음'}</span></div><div class="note">등록된 내용을 한곳에 모아 보여줄 뿐, 맞다 틀리다 판단하거나 용량을 계산하지 않아요.</div></div>`;
 const dx=done?`<div class="dx"><b>${c.dx[0]}</b>${c.dx[1]}<i>주상병</i></div>`:`<div class="dx"><input id="dc" aria-label="질병코드" placeholder="코드" value="${esc(dr.code)}" style="width:70px;height:30px;border:1px solid var(--g200);border-radius:10px;padding:0 8px;font:inherit;font-size:12px"><input id="dn" aria-label="상병명" placeholder="상병명" value="${esc(dr.name)}" style="flex:1;min-width:0;height:30px;border:1px solid var(--g200);border-radius:10px;padding:0 8px;font:inherit;font-size:12px"><i>주상병</i></div>`;
 const rx=done?c.rx.map(r=>`<div class="rx"><span><b>${r[0]}</b><small>${r[1]}</small></span><span class="q">${r[2]}</span></div>`).join(''):dr.rx.map((r,i)=>`<div class="rxi" style="margin-bottom:6px"><input data-r="${i},0" value="${esc(r[0])}" placeholder="약 이름 (의사가 쓴 그대로)" aria-label="약 이름"><input data-r="${i},1" value="${esc(r[1])}" placeholder="용법·횟수 (의사가 쓴 그대로)" aria-label="용법"><input data-r="${i},2" value="${esc(r[2])}" placeholder="양" aria-label="양" style="grid-column:auto"><button type="button" data-rd="${i}" aria-label="삭제">✕</button></div>`).join('')+`<button class="add" type="button" id="radd">+ 처방약 추가</button>`;
 $('rp').innerHTML=`<div class="ph"><h2><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM9 13h6v2H9zm0 4h6v2H9z"/></svg>비대면 진단서 및 전자처방전 작성<span class="badge ${done?'g':'r'}">${done?'발행 완료':'진단 작성중'}</span></h2></div>
 <div class="body">${sb}<div class="card"><div class="pat"><span class="ab">${sel.slice(1)}</span><span><b>${sel} 별님</b> <small style="color:var(--g500)">(${c.sex} · 만 ${c.age}세)</small><br><small style="color:var(--g500)">${c.cls} · ${c.no}</small></span><span class="tmp">현재 체온<b class="${c.v>=380?'':'n'}">${F(c.v)}°C</b></span></div><div class="warn ${c.warn.includes('금기 없음')?'n':'r'}">${c.warn.includes('금기 없음')?'⊘':'⊘'} ${c.warn}</div></div>
 <div class="card"><h3>📋 진단 상병 및 질병코드 (KCD-8)</h3>${dx}<div class="lb">진료 소견 및 원격 지도사항 <em>${done?'발행됨 · 고칠 수 없음':'실시간 동기화'}</em></div>${done?`<div class="ta">${c.memo}</div>`:`<textarea class="ta" id="ta" aria-label="진료 소견" placeholder="진료 소견 및 원격 지도사항을 적어 주세요">${esc(dr.memo)}</textarea>`+'<div class="phr" id="phr"></div>'}</div>
 <div class="card"><h3>💊 비대면 처방의약품 지정<em id="rxn">${done?c.rx.length+'개 품목':dr.rx.filter(r=>r[0].trim()).length+'개 품목'}</em></h3>${rx}<div class="note">의사가 쓴 글 그대로 저장돼요. 앱은 투약 용량을 계산하거나 추천하지 않아요.</div></div>${pre}</div>
 ${el}<div class="foot"><div class="l"><span>의사 전자서명: <b>강다혜 촉탁의 (원장)</b></span>${done?'<em>✔ 서명 완료</em>':'<span id="pmsg">발행하면 고칠 수 없어요</span>'}</div><button id="pubb" class="pub ${done?'done':'go'}" type="button">${done?'✔ 발행 완료 · '+c.rxno:'✔ 전자서명 완료 및 전자처방전 발행·전송'}</button></div>`}
function wire(){const c=CALLS[sel],dr=c.dr;if(c.done||!dr)return;
 const cnt=()=>{const n=dr.rx.filter(r=>r[0].trim()).length;$('rxn').textContent=n+'개 품목';$('prn').textContent=n?n+'개':'아직 없음'};
 $('dc').oninput=e=>dr.code=e.target.value;$('dn').oninput=e=>dr.name=e.target.value;$('ta').oninput=e=>dr.memo=e.target.value;
 document.querySelectorAll('[data-r]').forEach(i=>i.oninput=e=>{const [a,b]=i.dataset.r.split(',');dr.rx[a][b]=e.target.value;cnt()});
 document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{if(dr.rx.length>1)dr.rx.splice(+b.dataset.rd,1);else dr.rx=[['','','']];panel();wire();phrs()});
 $('radd').onclick=()=>{dr.rx.push(['','','']);panel();wire();phrs()};
 $('pubb').onclick=()=>{const rx=dr.rx.filter(r=>r[0].trim());const m=$('pmsg');
  if(!dr.name.trim()||!rx.length){m.textContent='상병명과 처방약 1개 이상을 적어 주세요';m.style.color='var(--r500)';return}
  c.done=true;c.dx=[dr.code.trim()||'-',dr.name.trim()];c.memo=esc(dr.memo.trim()||'(적은 소견 없음)').replace(/\n/g,'<br>');c.rx=rx.map(r=>[esc(r[0].trim()),esc(r[1].trim()||'-'),esc(r[2].trim()||'-')]);
  const no='Rx#'+(rxSeq++);c.rxno=no+' · '+hm();const t='강다혜 촉탁의 (원장)이 전자처방전을 발행했어요 ('+no+')';(c.ev=c.ev||[]).push({k:'sys',t});c.last=t;c.chat=md();all()}}
function phrs(){const h=$('phr');if(!h)return;h.innerHTML='<span class="note">자주 쓰는 문구</span><span class="tag" style="margin:0">제안</span>'+phr.map((t,i)=>`<button type="button" data-p="${i}" title="${t.replace(/"/g,'')}">${t}</button>`).join('')+'<button type="button" class="sv" id="psv">+ 지금 소견을 문구로 저장</button>';
 h.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const t=$('ta');t.value+=(t.value?'\n':'')+phr[b.dataset.p];t.dispatchEvent(new Event('input'))});
 $('psv').onclick=()=>{const v=$('ta').value.trim();if(v&&phr.length<5&&!phr.includes(v)){phr.push(v);phrs()}}}
let ss=11*3600+59*60+34;setInterval(()=>{ss=Math.max(0,ss-1);const x=document.querySelector('.sess b');if(x)x.textContent=String(Math.floor(ss/3600)).padStart(2,'0')+':'+String(Math.floor(ss%3600/60)).padStart(2,'0')+':'+String(ss%60).padStart(2,'0')},1000);
function hist(k){const c=CALLS[k];$('mht').textContent=k+' 투약 이력';
 $('mhb').innerHTML=`<h4>상시 복약</h4><p>${c.hist.reg||'등록된 상시 복약이 없어요'}</p><h4>필요시 투약 지시</h4><p>${c.hist.prn||'등록된 지시가 없어요'}</p><h4>전자처방전 ${c.done?1:0}건</h4>`+(c.done?`<p><b>[발행됨] ${c.dx[0]} ${c.dx[1]}</b> · ${c.rxno}</p>`+c.rx.map(r=>`<div class="rx" style="margin-top:6px"><span><b>${r[0]}</b><small>${r[1]}</small></span><span class="q">${r[2]}</span></div>`).join(''):'<p>발행된 처방전이 없어요</p>')+`<h4>이상 대응 투약 기록 ${c.hist.n}건</h4><p>${c.hist.n?'':'투약 기록이 없었어요'}</p>`;$('mh').classList.add('on')}
$('mhx').onclick=()=>$('mh').classList.remove('on');$('mh').onclick=e=>{if(e.target.id==='mh')$('mh').classList.remove('on')};
$('tO').onclick=()=>{tabOpen=true;sel=Object.keys(CALLS).find(k=>CALLS[k].open);openChat=sel;all()};$('tC').onclick=()=>{tabOpen=false;sel=Object.keys(CALLS).find(k=>!CALLS[k].open);openChat=sel;all()};
function all(){calls();chats();panel();wire();phrs()}
$('q').oninput=e=>{qv=e.target.value.trim();calls()};$('so').onclick=()=>{sortU=!sortU;$('so').setAttribute('aria-pressed',sortU);calls()};all();
</script>
</body></html>
