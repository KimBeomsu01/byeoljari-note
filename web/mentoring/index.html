<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>별자리노트 · 통합 시연 (가상 데이터)</title>
<style>
:root{--g50:#F9FAFB;--g100:#F2F4F6;--g200:#E5E8EB;--g300:#D1D6DB;--g400:#B0B8C1;--g500:#8B95A1;--g600:#6B7684;--g700:#4E5968;--g800:#333D4B;--g900:#191F28;
--b500:#3182F6;--b600:#2563EB;--b50:#E8F3FF;--r500:#F04452;--r700:#C5303D;--r50:#FEECEE;--gr500:#03B26C;--gr700:#027A4B;--gr50:#E6F7EF;--y50:#FFF6E0;--y700:#8A5D12;--o50:#FFF1E4;--o700:#9A4F12;--p500:#7C5CF0;--p50:#F1EDFF;
--sans:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--g900);background:var(--g100);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid rgba(49,130,246,.55);outline-offset:2px}
.mono{font-family:var(--mono)}
#root{height:100%;display:flex;flex-direction:column}
/* ── 상단 ── */
.hd{flex:none;background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;white-space:nowrap}
.brand small{font-weight:600;color:var(--g600);font-size:12.5px;margin-left:6px}
.demo-pill{background:var(--y50);color:var(--y700);font-weight:700;font-size:12px;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--g100);border-radius:12px;padding:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{min-height:40px;padding:2px 12px;border-radius:9px;font-weight:700;color:var(--g700);font-size:13.5px;line-height:1.25;text-align:left}
.tabs button small{display:block;font-weight:600;font-size:11.5px;color:var(--g600)}
.tabs button[aria-pressed=true]{background:#fff;color:var(--b600);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs button[aria-pressed=true] small{color:var(--b600)}
.hbtn{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--g300);background:#fff;font-weight:700;font-size:13px;color:var(--g700);white-space:nowrap}
.hbtn[aria-pressed=true]{background:var(--g900);color:#fff;border-color:var(--g900)}
.guide{flex:none;background:#fff;border-bottom:1px solid var(--g200);display:flex;gap:6px;padding:8px 16px;overflow-x:auto;align-items:stretch}
.gstep{flex:1 0 150px;text-align:left;border:1px solid var(--g200);border-radius:12px;padding:6px 10px;background:var(--g50);display:flex;gap:8px;align-items:flex-start;min-height:52px}
.gstep .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--g300);color:#fff;font:800 12px/22px var(--mono);text-align:center}
.gstep b{display:block;font-size:13px;line-height:1.3}
.gstep small{font-size:11.5px;color:var(--g600);font-weight:600}
.gstep.done{background:var(--gr50);border-color:rgba(3,178,108,.4)}
.gstep.done .n{background:var(--gr500)}
.gstep.next{background:var(--b50);border-color:var(--b500)}
.gstep.next .n{background:var(--b500)}
.gctl{flex:none;display:flex;flex-direction:column;gap:4px;justify-content:center;padding-left:6px;font-size:12.5px;font-weight:700;color:var(--g700)}
.gctl label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.main{flex:1;min-height:0;display:flex}
.phonecol{flex:none;width:404px;padding:12px 4px 12px 16px;display:flex;flex-direction:column;min-height:0}
.phonecol .cap{font-size:12px;font-weight:700;color:var(--g600);padding:0 6px 6px}
.pccol{flex:1;min-width:0;padding:12px 16px 12px 12px;display:flex;flex-direction:column;min-height:0}
.pcframe{flex:1;min-height:0;background:var(--g100);border:1px solid var(--g300);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pcbar{flex:none;height:48px;background:rgba(255,255,255,.95);border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12.5px}
.pcbar b{font-size:14px}
.pcbar .sep{color:var(--g300)}
.pcbar .fac{background:var(--g100);border:1px solid var(--g200);border-radius:999px;padding:2px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.pcbar .user{margin-left:auto;text-align:right;line-height:1.25;white-space:nowrap}
.pcbar .user small{display:block;color:var(--g600);font-size:11.5px}
.pcbar .owner{background:var(--b50);color:var(--b600);font-weight:800;border-radius:999px;padding:2px 10px;font-size:12px;white-space:nowrap}
.pcbody{flex:1;min-height:0;overflow:auto}
/* ── 공통 조각 ── */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.red{background:var(--r50);color:var(--r700)}.pill.blue{background:var(--b50);color:var(--b600)}.pill.gray{background:var(--g100);color:var(--g700)}.pill.green{background:var(--gr50);color:var(--gr700)}.pill.yel{background:var(--y50);color:var(--y700)}.pill.org{background:var(--o50);color:var(--o700)}.pill.pur{background:var(--p50);color:#5B3FD6}.pill.solid{background:var(--r500);color:#fff}
.tag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;white-space:nowrap}
.tag.new{background:var(--b50);color:var(--b600)}.tag.ask{background:var(--y50);color:var(--y700)}
.row{display:flex;align-items:center;gap:8px}
.muted{color:var(--g600);font-size:12.5px}
.btn{min-height:36px;border-radius:999px;font-weight:700;font-size:13px;padding:0 14px;white-space:nowrap}
.btn.pri{background:var(--b500);color:#fff}.btn.pri:hover{background:var(--b600)}
.btn.sec{background:#fff;border:1px solid var(--g300);color:var(--g700)}.btn.sec:hover{background:var(--g100)}
.btn.red{background:var(--r500);color:#fff}
.btn:disabled{opacity:.45}
.panel{background:#fff;border:1px solid var(--g200);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.03);display:flex;flex-direction:column;min-height:0}
.panel>h3{flex:none;font-size:15px;padding:12px 14px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:8px}
.panel .scroll{flex:1;min-height:0;overflow-y:auto}
.kcard{background:#fff;border:1px solid var(--g200);border-radius:16px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.empty{text-align:center;color:var(--g600);padding:26px 10px;font-weight:600}
.inp{width:100%;min-height:36px;border:1px solid var(--g300);border-radius:10px;padding:6px 10px;background:#fff}
textarea.inp{resize:vertical;min-height:64px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--g600);margin:8px 0 3px}
/* ── 현황판 ── */
.board{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;min-width:980px}
.board h1{font-size:19px;grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{color:var(--gr700);font-size:12.5px;font-weight:700}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;grid-column:1/-1}
.cards4 .kcard small{font-size:12px;font-weight:700;color:var(--g600);display:block}
.cards4 .kcard b{font:800 24px/1.3 var(--mono)}
.cards4 .kcard.hot{background:#FEF2F2;border-color:#FECACA}
.cards4 .kcard p{font-size:12.5px;color:var(--g700);margin-top:2px}
.bar{height:6px;border-radius:3px;background:var(--g200);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b500)}
.ctabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--g200)}
.ctabs button{min-height:32px;padding:0 12px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--g700);background:var(--g100)}
.ctabs button[aria-pressed=true]{background:var(--g900);color:#fff}
table.bt{width:100%;border-collapse:collapse;font-size:13px}
table.bt th{font-size:12px;color:var(--g600);text-align:left;padding:8px 10px;background:var(--g50);border-bottom:1px solid var(--g200);white-space:nowrap}
table.bt td{padding:8px 10px;border-bottom:1px solid var(--g100);vertical-align:middle}
table.bt tr.clk{cursor:pointer}table.bt tr.clk:hover td{background:var(--b50)}
table.bt tr.hot td{background:#FEF2F2}table.bt tr.hot td:first-child{box-shadow:inset 3px 0 0 var(--r500)}
table.bt tr.flash td{animation:fl 2.4s ease-out}
@keyframes fl{0%{background:#FFE8A3}100%{}}
.tv{font:800 17px var(--mono)}.tv.hot{color:var(--r500)}.tv.ok{color:var(--gr700)}
.av2{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g100);font-weight:800;font-size:11.5px;color:var(--g700);margin-right:6px}
.pager{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12.5px;color:var(--g600)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.tile{background:#fff;border:1px solid var(--g200);border-radius:14px;padding:8px 10px;text-align:left}
.tile.hot{border-color:var(--r500)}
.tile b{display:block;font-size:13px}.tile small{font-size:11.5px;color:var(--g600);font-weight:600}
.feed{display:grid;gap:8px;padding:10px}
.fcard{border:1px solid var(--g200);border-radius:14px;padding:10px;background:#fff;font-size:13px}
.fcard.red{border-color:#FECACA;background:#FEF2F2}.fcard.new{animation:fl 2.4s ease-out}
.fcard time{font:700 12px var(--mono);color:var(--g600)}
/* ── 호출함 · 의료진 ── */
.three{display:grid;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px;height:100%;min-width:1000px}
.three.calls{grid-template-columns:270px minmax(320px,1fr) 360px}
.three.doc{grid-template-columns:270px minmax(300px,1fr) 380px}
.clist{padding:10px;display:grid;gap:8px;align-content:start;background:rgba(249,250,251,.6)}
.ccard{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:18px;border:1px solid var(--g200);background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ccard:hover{background:rgba(49,130,246,.08);border-color:var(--b500)}
.ccard[aria-pressed=true]{background:rgba(49,130,246,.14);border-color:var(--b500);box-shadow:0 0 0 1px var(--b500)}
.ccard .cl{font-size:11.5px;font-weight:700;background:var(--g100);color:var(--g700);border-radius:8px;padding:0 6px}
.ccard .who{border-top:1px solid var(--g100);margin-top:8px;padding-top:6px;font-size:12px;color:var(--g600)}
.ccard .who.unread{color:var(--b500);font-weight:700}
.ccard p{font-size:12.5px;color:var(--g700);margin-top:5px;line-height:1.4}
.chat{padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:82%;padding:10px 12px;border-radius:16px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--b500);color:#fff}
.bub.other{align-self:flex-start;background:#fff;border:1px solid var(--g200)}
.bub.doc{align-self:flex-start;background:#fff;border:1px solid #BFDBFE;box-shadow:0 0 0 1px #DBEAFE}
.bmeta{font-size:11.5px;color:var(--g600);font-weight:600;margin-bottom:-6px}
.bmeta.r{align-self:flex-end}
.sys{align-self:center;font-size:12px;color:var(--g600);background:var(--g100);border-radius:999px;padding:3px 12px;text-align:center}
.vcard{align-self:center;width:min(100%,360px);border:1px solid var(--g200);border-radius:14px;padding:10px 12px;background:#fff;font-size:12.5px}
.vcard h5{font-size:12px;color:var(--b500);margin-bottom:4px}
.vcard b{font:800 20px var(--mono)}
.composer{flex:none;border-top:1px solid var(--g200);padding:10px;display:flex;gap:8px;background:#fff;border-radius:0 0 16px 16px}
.composer input{flex:1;min-height:40px;border-radius:999px;border:1px solid var(--g200);background:var(--g100);padding:0 14px}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--g200);background:var(--g50);align-items:center}
.hr{padding:12px;display:grid;gap:10px;background:rgba(249,250,251,.5)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbox{text-align:center;border-radius:16px;padding:8px;background:var(--g100);border:1px solid var(--g200)}
.tbox.hot{background:#FEF2F2;border-color:#FECACA}.tbox.hot b,.tbox.hot small{color:var(--r500)}
.tbox small{display:block;font-size:11.5px;font-weight:700;color:var(--g600)}.tbox b{font:800 19px var(--mono)}
.note{background:var(--g100);border-radius:12px;padding:8px 10px;font-size:12.5px}
.warnbox{background:#FEF2F2;border:1px solid rgba(254,202,202,.8);border-radius:12px;padding:8px 10px;color:var(--r700);font-weight:700;font-size:12.5px}
.acc{border:1px solid var(--g200);border-radius:14px;background:#fff;margin:10px;overflow:hidden}
.acc>button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 12px}
.acc>button:hover{background:var(--g50)}
.rxrow{display:grid;grid-template-columns:1.2fr 1.6fr .8fr 30px;gap:6px;margin-top:6px}
/* ── 일정 ── */
.sched{display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:200px minmax(0,1fr) auto;height:100%;min-width:980px}
.srail{border-right:1px solid var(--g200);background:#fff;padding:12px;overflow-y:auto}
.srail h4{font-size:12px;color:var(--g600);margin:12px 0 4px}
.tog{display:flex;align-items:center;gap:8px;width:100%;text-align:left;min-height:30px;font-size:13px;font-weight:600;border-radius:8px;padding:0 4px}
.tog:hover{background:var(--g100)}
.tog i{width:10px;height:10px;border-radius:50%;flex:none}
.tog[aria-pressed=false]{color:var(--g500);text-decoration:line-through}
.tog[aria-pressed=false] i{background:var(--g300)!important}
.scal{display:flex;flex-direction:column;min-width:0;min-height:0}
.stool{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--g200)}
.stool h2{font-size:18px;margin-right:auto}
.dow{flex:none;display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-bottom:1px solid var(--g200);font-size:12px;font-weight:700;color:var(--g600)}
.dow span{padding:4px 8px}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(92px,1fr);overflow-y:auto;background:var(--g200);gap:1px}
.cell{background:#fff;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0;cursor:pointer;text-align:left}
.cell.out{background:var(--g50)}.cell.out .dn{color:var(--g400)}
.cell:hover{background:#FBFDFF}
.dn{font:700 12.5px var(--mono);width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%}
.cell.today .dn{background:var(--b500);color:#fff}
.evt{display:block;width:100%;text-align:left;font-size:12px;font-weight:600;border-radius:6px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.evt[aria-pressed=true]{box-shadow:0 0 0 2px var(--g900)}
.evt.auto{background:var(--p50);color:#5B3FD6}.evt.auto.red{background:var(--r50);color:var(--r700)}
.evt.done{opacity:.55}.evt.cx{text-decoration:line-through;opacity:.5}
.evt.newf{animation:fl 2.4s ease-out}
.more{font-size:11.5px;color:var(--g600);font-weight:700;padding:0 6px}
.qadd{width:100%;border:1px solid var(--b500);border-radius:6px;font-size:12px;padding:2px 6px}
.spanel{width:300px;border-left:1px solid var(--g200);background:#fff;padding:14px;overflow-y:auto}
/* ── 휴대폰 ── */
.phone{flex:1;min-height:0;background:var(--g100);border-radius:30px;border:8px solid #111;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 14px 36px rgba(0,0,0,.22);font-size:15px}
.phone .ptop{flex:none;height:54px;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--g200)}
.phone .ptop h2{font-size:17px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phone .ptop .sub{font-size:12.5px;color:var(--g600);font-weight:600;margin-left:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ib:hover{background:var(--g100)}
.ib svg{width:24px;height:24px;fill:none;stroke:var(--g800);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:0;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--r500);color:#fff;font:700 11px/18px var(--mono);text-align:center;padding:0 4px;border:2px solid #fff;box-sizing:content-box}
.pbody{flex:1;overflow-y:auto;padding:10px 10px 22px;display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border:1px solid var(--g200);border-radius:18px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mcard.urgent{border-color:var(--r500);border-top-width:3px}
.mcard.flash{animation:fl 2.4s ease-out}
.seg{display:flex;background:var(--g200);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:700;color:var(--g600)}
.seg button[aria-pressed=true]{background:#fff;color:var(--g900);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--g200);font-weight:700;font-size:13.5px;color:var(--g700);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--g900);color:#fff;border-color:var(--g900)}
.chip .n{font-family:var(--mono);margin-left:4px;color:var(--b500)}.chip[aria-pressed=true] .n{color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.sum div{text-align:center;background:var(--g50);border-radius:14px;padding:6px 4px}
.sum small{display:block;font-size:12px;color:var(--g600);font-weight:600}.sum b{font:800 22px/1.2 var(--mono)}
.cls{display:inline-block;font-size:12px;font-weight:700;background:var(--g100);color:var(--g700);border-radius:8px;padding:1px 7px;white-space:nowrap}
.name{font-size:16.5px;font-weight:800;text-decoration:underline;text-decoration-color:var(--g300);text-underline-offset:4px;min-height:36px;white-space:nowrap}
.time{margin-left:auto;font:600 12px var(--mono);color:var(--g600);white-space:nowrap}
.temp{font:800 21px var(--mono)}.temp.hot{color:var(--r500)}
.txt{font-size:14.5px;color:var(--g800);margin-top:6px;overflow-wrap:anywhere}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stbox{background:var(--g50);border:1px solid var(--g200);border-radius:14px;padding:7px 10px}
.stbox small{display:block;font-size:11.5px;font-weight:700;color:var(--g600)}.stbox b{font-size:13.5px}
.stbox.done b{color:var(--gr700)}.stbox.todo b{color:var(--r500)}
.macts{display:flex;gap:8px;margin-top:10px}
.mbtn{flex:1;min-height:50px;border-radius:14px;font-weight:800;font-size:14.5px;padding:0 8px}
.mbtn.pri{background:var(--b500);color:#fff}.mbtn.sec{background:var(--g100);color:var(--g800)}.mbtn.ghost{background:#fff;border:1px solid var(--g300);color:var(--g700)}
.mbtn:disabled{opacity:.45}
.pnav{flex:none;height:72px;background:#fff;border-top:1px solid var(--g200);display:flex;align-items:center;justify-content:space-around;padding:0 8px}

      if (e) { h += '<aside class="spanel" data-scroll="sched-panel"><div class="row"><b>일정 편집</b>' + (e.canceled ? '<span class="pill gray">취소됨</span>' : '') + '<button class="btn sec" data-a="sched.close" style="margin-left:auto;min-height:30px">닫기</button></div><label class="lbl" for="ev-title">제목</label><input class="inp" id="ev-title" value="' + esc(e.title) + '"><label class="lbl" for="ev-date">날짜</label><input class="inp" id="ev-date" type="date" value="' + iso(e.day) + '"><label class="row" style="margin-top:8px;font-weight:600"><input type="checkbox" id="ev-allday"' + (e.start == null ? ' checked' : '') + '> 종일</label>' + (e.start != null ? '<div class="two"><div><label class="lbl" for="ev-start">시작</label><input class="inp" id="ev-start" type="time" value="' + tstr(e.start) + '"></div><div><label class="lbl" for="ev-end">종료</label><input class="inp" id="ev-end" type="time" value="' + tstr(e.end) + '"></div></div>' : '') + (su.err ? '<div class="warnbox" style="margin-top:6px">' + su.err + '</div>' : '');
        h += '<label class="lbl" for="ev-cat">업무</label><select class="inp" id="ev-cat">' + B.CATS.map(function (c) { return '<option value="' + c.id + '"' + (c.id === e.cat ? ' selected' : '') + '>' + c.name + '</option>'; }).join('') + '</select><label class="lbl" for="ev-rid">대상 별님 (선택)</label><select class="inp" id="ev-rid"><option value="">없음</option>' + B.RES.map(function (r) { return '<option value="' + r.id + '"' + (r.id === e.rid ? ' selected' : '') + '>' + r.name + ' · ' + cn(r.cls) + '</option>'; }).join('') + '</select><label class="lbl" for="ev-cls">반</label><select class="inp" id="ev-cls"' + (e.rid ? ' disabled' : '') + '><option value="all">시설 전체</option>' + B.CL.map(function (c) { return '<option value="' + c.id + '"' + (c.id === e.cls ? ' selected' : '') + '>' + c.name + '</option>'; }).join('') + '</select>' + (e.rid ? '<p class="muted">별님을 붙이면 반은 그 별님의 반으로 맞춰지고, 어플 별님카드의 일정 묶음에 읽기 전용으로 보입니다.</p>' : '') + '<label class="lbl" for="ev-memo">메모</label><textarea class="inp" id="ev-memo">' + esc(e.memo) + '</textarea><p class="muted" style="margin-top:8px">만든 사람 ' + esc(e.by) + ' · 고치면 바로 저장돼요</p><button class="btn sec" data-a="sched.cancel" data-v="' + e.id + '" style="margin-top:8px;width:100%">' + (e.canceled ? '취소 되돌리기' : '일정 취소 (지우지 않고 남김)') + '</button></aside>'; }
      else if (a) { h += '<aside class="spanel"><div class="row"><span class="pill ' + (a.kind === 'todo' ? 'pur' : 'red') + '">자동 · 읽기 전용</span><button class="btn sec" data-a="sched.close" style="margin-left:auto;min-height:30px">닫기</button></div><h3 style="margin-top:8px;font-size:17px">' + (a.done ? '✓ ' : '') + esc(a.title) + '</h3><p class="muted">' + B.dayLabel(a.day) + (a.start != null ? ' ' + B.hm(a.start) : ' · 종일') + '</p><div class="note" style="margin-top:8px">' + esc(a.info) + (a.text ? '<br>' + esc(a.text) : '') + '</div><p class="muted" style="margin-top:8px">이 항목은 ' + (a.kind === 'call' ? '의료 호출함' : a.kind === 'case' ? '이상 대응 기록' : '어플·호출함의 재측정과 인수인계 할 일') + '에서 읽어 온 것입니다. 달력에서는 고칠 수 없어요.</p>' + (a.callId ? '<button class="btn pri" data-a="board.call" data-v="' + a.callId + '" style="margin-top:8px;width:100%">의료 호출함에서 열기</button>' : a.rid ? '<button class="btn pri" data-a="board.row" data-v="' + a.rid + '" style="margin-top:8px;width:100%">' + R(a.rid).name + ' 호출함·건강기록 열기</button>' : '') + '</aside>'; }
      else su.sel = null; }
    return h + '</div>'; };
  ACT['sched.tog'] = function (v) { U.sched.off[v] = !U.sched.off[v]; }; ACT['sched.cx'] = function () { U.sched.showCx = !U.sched.showCx; };
  ACT['sched.mo'] = function (v) { U.sched.mo = v === '0' ? 0 : U.sched.mo + +v; U.sched.add = null; };
  ACT['sched.sel'] = function (v, el, ev) { ev.stopPropagation(); U.sched.sel = v; U.sched.add = null; U.sched.err = null; };
  ACT['sched.close'] = function () { U.sched.sel = null; };
  ACT['sched.add'] = function (v, el, ev) { if (ev.target.closest('.evt,.more,.qadd')) return false; if (el.classList.contains('btn')) U.sched.mo = 0; U.sched.add = +v; U.sched.addText = ''; U.sched.sel = null; };
  ACT['sched.more'] = function (v) { var day = +v; U.modal = '<h3>' + B.dayLabel(day) + ' 일정</h3><div style="display:grid;gap:4px;margin-top:8px">' + itemsOn(day).map(function (x) { return evBtn(x, {}); }).join('') + '</div>'; };
  ACT['sched.cancel'] = function (v) { var e = B.calEvent(v); B.updateEvent(v, { canceled: !e.canceled }); };
  function addQuick() { var su = U.sched, t = su.addText.trim(); if (!t) { su.add = null; A.render(); return; } var on = B.CL.filter(function (c) { return !su.off['cls:' + c.id]; }); var e = B.addEvent({ title: t, day: su.add, cls: on.length === 1 ? on[0].id : 'all', cat: 'facility' }); su.add = null; su.addText = ''; su.sel = e.id; A.render(); }

  /* ───────── 입력 처리 (글자를 칠 때는 화면을 다시 그리지 않음) ───────── */
  V.input = function (t) { var id = t.id, m;
    if (id === 'callText') U.calls.text = t.value; else if (id === 'noteText') U.calls.note = t.value; else if (id === 'docText') U.doc.text = t.value; else if (id === 'qadd') U.sched.addText = t.value;
    else if (id.indexOf('rx-') === 0 && U.doc.sel) { var d = draft(U.doc.sel); if (id === 'rx-code') d.code = t.value; else if (id === 'rx-name') d.name = t.value; else if (id === 'rx-memo') d.memo = t.value; else if ((m = /^rx-i-(\d+)-(name|usage|amount)$/.exec(id))) d.items[+m[1]][m[2]] = t.value; B.commit(true); var b = document.getElementById('rx-issue'); if (b) b.disabled = !canIssue(d); } };
  V.enter = function (t) { if (t.id === 'callText') { if (ACT['calls.send']() !== false) A.render(); return true; } if (t.id === 'docText') { if (ACT['doc.send']() !== false) A.render(); return true; } if (t.id === 'noteText') { if (ACT['calls.note'](U.calls.rid) !== false) A.render(); return true; } if (t.id === 'qadd') { addQuick(); return true; } return false; };
  V.change = function (t) { var su = U.sched, id = t.id; if (id === 'showCx') { su.showCx = t.checked; return true; } if (id.indexOf('ev-') !== 0 || !su.sel) return false; var e = B.calEvent(su.sel); if (!e) return false; su.err = null;
    if (id === 'ev-title') { if (t.value.trim()) B.updateEvent(e.id, { title: t.value.trim() }); else { su.err = '제목은 비울 수 없어요'; return true; } }
    else if (id === 'ev-date') { if (t.value) B.updateEvent(e.id, { day: dayFromIso(t.value) }); }
    else if (id === 'ev-allday') B.updateEvent(e.id, t.checked ? { start: null, end: null } : { start: 600, end: 660 });
    else if (id === 'ev-start' || id === 'ev-end') { var s2 = id === 'ev-start' ? tnum(t.value) : e.start, e2 = id === 'ev-end' ? tnum(t.value) : e.end; if (s2 == null) return true; if (e2 != null && e2 < s2) { su.err = '종료가 시작보다 이를 수 없어요. 저장하지 않았어요.'; return true; } B.updateEvent(e.id, { start: s2, end: e2 }); }
    else if (id === 'ev-cat') B.updateEvent(e.id, { cat: t.value }); else if (id === 'ev-cls') B.updateEvent(e.id, { cls: t.value }); else if (id === 'ev-rid') B.updateEvent(e.id, { rid: t.value || null }); else if (id === 'ev-memo') B.updateEvent(e.id, { memo: t.value });
    return false; };
  V.after = function () { var q = document.getElementById('qadd'); if (q && document.activeElement !== q) q.focus(); };
  document.addEventListener('keydown', function (ev) { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr.clk')) { ev.preventDefault(); ev.target.click(); } });
})();

</script>
