<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>별자리노트 · PC 일정 시제품 v2</title>
<style>
/* 별자리노트 디자인 토큰
   출처: Google Stitch 내보내기 4개 화면의 tailwind.config 색상·그림자·라운드 값을 그대로 옮김.
   모든 아트보드가 이 파일을 링크하므로 여기 값을 바꾸면 전체 화면에 반영됩니다.
   같은 값의 JSON 버전: tokens.json */
:root {
  /* ── Color · Neutral ── */
  --bg: #F2F4F6;          /* 앱 배경 (toss.bg / gray100) */
  --surface: #FFFFFF;     /* 카드·시트 (toss.card) */
  --gray-50: #F9FAFB;
  --gray-100: #F2F4F6;
  --gray-200: #E5E8EB;
  --gray-300: #D1D6DB;
  --gray-400: #B0B8C1;
  --gray-500: #8B95A1;    /* muted */
  --gray-600: #6B7684;
  --gray-700: #4E5968;    /* secondary */
  --gray-800: #333D4B;
  --gray-900: #191F28;    /* primary text */

  /* ── Color · Brand / Status ── */
  --violet-500: #7C5CF0;  /* 주요 액션 버튼: 퀵 체온, 기록하기, 재측정하기, 간호 선생님 바로 통화 */
  --violet-600: #6A4BDF;  /* 주요 액션 hover */
  --blue-500: #3182F6;    /* 정보, 링크, 보조 액션, 건수 뱃지 */
  --blue-600: #2563EB;    /* blue 버튼 hover */
  --blue-50: #E8F3FF;
  --red-500: #F04452;     /* 긴급, 체온 상승 */
  --red-50: #FEECEE;
  --red-25: #FFF5F5;      /* PC: 긴급 행 배경 */
  --green-500: #03B26C;   /* PC: 정상, 완료, 연동됨 */
  --green-50: #E8F9F1;
  --orange-500: #FF8A00;  /* PC: 주의, 생활 케어 일정 */
  --orange-50: #FFF4E6;
  --cyan-500: #00B8D9;    /* PC: 재활 · 치료 일정 */
  --cyan-50: #E6FCFF;

  /* ── Color · Alpha ── */
  --border-card: rgba(229, 232, 235, 0.5);   /* gray-200 / 50% */
  --border-chip: rgba(229, 232, 235, 0.7);   /* gray-200 / 70% */
  --border-danger: rgba(240, 68, 82, 0.2);   /* red-500 / 20% */
  --border-info: rgba(49, 130, 246, 0.2);    /* blue-500 / 20% */

  /* ── Elevation ── */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-bar: 0 1px 3px rgba(0, 0, 0, 0.03);
  --shadow-tile: 0 1px 4px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.03);
  --shadow-float: 0 2px 8px rgba(0, 0, 0, 0.08);
  --shadow-dial: 0 8px 24px rgba(0, 0, 0, 0.07);
  --shadow-danger: 0 4px 16px rgba(240, 68, 82, 0.06);
  --shadow-primary: 0 8px 20px rgba(124, 92, 240, 0.35);   /* 주요 액션 플로팅 버튼 (violet) */

  /* ── Typography ── */
  --font-sans: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
  --font-geist: 'Geist', 'Pretendard', 'Inter', sans-serif;   /* PC: 라벨 · 캡션 */
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;   /* PC: 시각 · 수치 */

  /* ── Radius (px 값 그대로 이름에 사용) ── */
  --radius-4: 4px;
  --radius-6: 6px;
  --radius-12: 12px;
  --radius-14: 14px;
  --radius-16: 16px;
  --radius-20: 20px;
  --radius-24: 24px;
  --radius-full: 9999px;
}

/* 기존 PC 틀(pc.css)의 리셋 중 레일·머리 바에 필요한 부분 */
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#E5E7EB}
a{color:inherit;text-decoration:inherit}
svg{display:block;vertical-align:middle}
@keyframes pc-pulse{50%{opacity:.5}}
:root{
  --g50:#F9FAFB;--g100:#F2F4F6;--g200:#E5E8EB;--g300:#D1D6DB;--g400:#B0B8C1;--g500:#8B95A1;--g600:#6B7684;--g700:#4E5968;--g800:#333D4B;--g900:#191F28;
  --blue:#3182F6;--blue6:#2563EB;--blue50:#E8F3FF;--red:#F04452;--red50:#FEECEE;--green:#03B26C;--green50:#E8F9F1;--greenInk:#047857;
  --orange:#FF8A00;--orange50:#FFF4E6;--orangeInk:#B45309;--cyan:#06B6D4;--cyan50:#ECFEFF;--cyanInk:#0E7490;--violet:#7C5CF0;--violet50:#F1EDFE;
  --hour:44px;
}
html,body{height:100%;margin:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--g900);background:var(--g100);font-size:14px;line-height:1.45;min-width:1280px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input[type=checkbox],input[type=radio]{border-width:1px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.app{display:grid;grid-template-columns:232px 1fr;height:calc(100vh - 96px);min-height:640px;overflow:hidden;background:#fff;border:1px solid rgba(229,232,235,.8);border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,.04);font-size:14px;line-height:1.45}
.app.panel-open{grid-template-columns:232px 1fr 328px}
.app.side-closed{grid-template-columns:0 1fr}
.app.side-closed.panel-open{grid-template-columns:0 1fr 328px}
.app.side-closed .side{display:none}

/* 레일 (pc_shell 자리) */
.rail{background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:40px;height:40px;border-radius:12px;background:var(--blue50);color:var(--blue);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.rail a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--g500);text-decoration:none;font-size:11px}
.rail a.on{background:var(--blue);color:#fff;font-weight:700}

/* 왼쪽 목록 */
.side{background:#fff;border-right:1px solid var(--g200);overflow:auto;padding:14px 12px 20px}
.mini-head{display:flex;align-items:center;justify-content:space-between;font-weight:700;margin-bottom:6px}
.mini-head button{width:26px;height:26px;border-radius:50%;color:var(--g600)}
.mini-head button:hover{background:var(--g100)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;text-align:center;font-size:12px}
.mini .dow{color:var(--g500);padding:3px 0}
.mini button{height:26px;border-radius:50%;position:relative;color:var(--g800)}
.mini button.out{color:var(--g400)}
.mini button:hover{background:var(--g100)}
.mini button.sel{background:var(--blue50);color:var(--blue6);font-weight:700}
.mini button.today{background:var(--blue);color:#fff;font-weight:700}
.mini button.has::after{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;border-radius:50%;background:currentColor;transform:translateX(-50%);opacity:.6}
.find{margin:14px 0 4px;position:relative}
.find input{width:100%;height:34px;border:1px solid var(--g200);border-radius:10px;padding:0 10px;background:var(--g50)}
.find .drop{position:absolute;z-index:5;left:0;right:0;top:38px;background:#fff;border:1px solid var(--g200);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);max-height:220px;overflow:auto}
.find .drop button{display:block;width:100%;text-align:left;padding:7px 10px}
.find .drop button:hover{background:var(--g100)}
.grp{margin-top:16px}
.grp h3{font-size:12px;color:var(--g500);font-weight:600;margin:0 0 4px 4px;display:flex;justify-content:space-between}
.cal-row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border-radius:8px;text-align:left}
.cal-row:hover{background:var(--g100)}
.cal-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.cal-row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-row .sub{color:var(--g500);font-size:12px}
.cal-row .eye{color:var(--g500);font-size:12px;flex:none}
.cal-row.off .nm{color:var(--g400);text-decoration:line-through}
.cal-row.off .dot{opacity:.3}
.cal-row .only{display:none;font-size:11px;color:var(--blue6)}
.cal-row:hover .only{display:inline}
.badge2{font-size:10px;font-weight:700;color:var(--violet);background:var(--violet50);border-radius:4px;padding:1px 5px;margin-left:4px}

/* 가운데 */
.main{display:flex;flex-direction:column;min-width:0;background:#fff}
.bar{display:flex;flex-wrap:wrap;row-gap:6px;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--g200);min-height:56px}
.bar h1{font-size:20px;margin:0 6px 0 0;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:90px}
.bar button,.bar .who{white-space:nowrap;flex:none}
.icon-btn{width:32px;height:32px;border-radius:8px;color:var(--g600);display:grid;place-items:center}
.icon-btn:hover{background:var(--g100)}
.pill{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--g200);background:#fff;font-weight:600}
.pill:hover{background:var(--g50)}
.seg{display:flex;background:var(--g100);border-radius:9px;padding:3px}
.seg button{height:26px;padding:0 14px;border-radius:7px;color:var(--g600)}
.seg button.on{background:#fff;color:var(--g900);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.spacer{flex:1}
.search{height:32px;flex:0 1 220px;min-width:110px;width:220px;border:1px solid var(--g200);border-radius:8px;padding:0 10px;background:var(--g50)}
.primary{height:32px;padding:0 14px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700}
.primary:hover{background:var(--blue6)}
.who{display:inline-flex;align-items:center;gap:6px;background:var(--violet50);color:var(--violet);border-radius:999px;padding:3px 6px 3px 12px;font-weight:700}
.who button{width:20px;height:20px;border-radius:50%;color:var(--violet)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:36px;z-index:10;background:#fff;border:1px solid var(--g200);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:220px;padding:6px}
.menu .pop button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px}
.menu .pop button:hover{background:var(--g100)}
.menu .pop .note{font-size:12px;color:var(--g500);padding:6px 10px;border-top:1px solid var(--g200);margin-top:4px}
.board{flex:1;min-height:0;overflow:auto;position:relative}

/* 월 */
.dow-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--g200);position:sticky;top:0;background:#fff;z-index:2}
.dow-row div{padding:6px 10px;font-size:12px;color:var(--g500);text-align:right}
.dow-row div:first-child{color:var(--red)}
.month{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(118px,1fr);min-height:calc(100% - 31px)}
.cell{border-right:1px solid var(--g200);border-bottom:1px solid var(--g200);padding:4px 5px 6px;min-width:0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--g50)}
.cell.out .num{color:var(--g400)}
.cell.sel{background:#F5F9FF}
.cell .top{display:flex;justify-content:flex-end;align-items:center;gap:6px;min-height:24px}
.cell .hol{font-size:11px;color:var(--red);margin-right:auto}
.cell .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.cell.sun .num{color:var(--red)}
.cell.today .num{background:var(--blue);color:#fff}
.chip{display:flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;font-size:12px;white-space:nowrap;overflow:hidden;width:100%;text-align:left;border-left:3px solid var(--c);background:var(--bg);color:var(--ink)}
.chip .t{color:var(--g600);font-size:11px;flex:none}
.chip .tx{overflow:hidden;text-overflow:ellipsis}
.chip.allday{border-left:0;background:var(--c);color:#fff;font-weight:600}
.chip.auto{border-left-style:dashed;background:#fff;box-shadow:inset 0 0 0 1px var(--g200)}
.chip.auto.band{background:var(--red50);box-shadow:none;border-left:3px solid var(--red);color:#B4232F;font-weight:600}
.chip.done{opacity:.55}
.chip.late{box-shadow:inset 0 0 0 1px var(--red);color:var(--red)}
.chip.cancel{text-decoration:line-through;opacity:.5}
.chip.active{outline:2px solid var(--blue);outline-offset:0}
.more{font-size:11px;color:var(--g600);padding:0 6px;text-align:left}
.more:hover{color:var(--blue6)}
.quick{height:22px;width:100%;border:1.5px solid var(--blue);border-radius:5px;padding:0 6px;font-size:12px}

/* 주 · 일 */
.tg-head{display:grid;position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--g200)}
.tg-head .dh{padding:6px 8px;text-align:center;font-size:12px;color:var(--g500);border-left:1px solid var(--g200);cursor:pointer}
.tg-head .dh b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:15px;color:var(--g900);margin-left:4px}
.tg-head .dh.today b{background:var(--blue);color:#fff}
.tg-head .ad{border-left:1px solid var(--g200);padding:2px 3px;display:flex;flex-direction:column;gap:2px;min-height:26px;min-width:0;cursor:pointer}
.tg-head .gut{font-size:11px;color:var(--g500);text-align:right;padding:4px 6px}
.tg{display:grid;position:relative}
.tg .gut{position:relative}
.tg .gut span{position:absolute;right:6px;font-size:11px;color:var(--g500);transform:translateY(-7px)}
.col{position:relative;border-left:1px solid var(--g200);background-image:linear-gradient(var(--g200) 1px,transparent 1px);background-size:100% var(--hour);cursor:pointer}
.shift{position:absolute;left:0;right:0;pointer-events:none}
.shift span{position:absolute;right:4px;top:2px;font-size:10px;color:var(--g500)}
.ev{position:absolute;border-radius:6px;padding:2px 6px;font-size:12px;overflow:hidden;border-left:3px solid var(--c);background:var(--bg);color:var(--ink);text-align:left;line-height:1.3}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:var(--g600);font-size:11px}
.ev.auto{background:#fff;border:1px dashed var(--c);border-left:3px solid var(--c)}
.ev.routine{background:var(--g50);border-left-color:var(--g400);color:var(--g700)}
.ev.done{opacity:.55}.ev.late{border-color:var(--red);color:var(--red)}
.ev.cancel{text-decoration:line-through;opacity:.5}
.ev.active{outline:2px solid var(--blue)}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.empty{padding:60px 20px;text-align:center;color:var(--g500)}

/* 검색 결과 */
.results{padding:8px 16px 24px;max-width:860px}
.results h2{font-size:13px;color:var(--g500);font-weight:600;margin:14px 0 6px}
.res{display:grid;grid-template-columns:150px 12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:8px}
.res:hover{background:var(--g100)}
.res .dot{width:10px;height:10px;border-radius:3px}
.res .meta{color:var(--g500);font-size:12px}
.res.dim{opacity:.55}

/* 오른쪽 패널 */
.panel{background:#fff;border-left:1px solid var(--g200);overflow:auto;padding:14px 16px 24px;display:none}
.app.panel-open .panel{display:block}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--g500);font-size:12px}
.title-in{width:100%;border:0;border-bottom:1px solid var(--g200);font-size:18px;font-weight:700;padding:6px 0;margin-bottom:6px}
.f{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--g100)}
.f>label,.f>span.l{color:var(--g500);font-size:12px;padding-top:6px}
.f input[type=text],.f input[type=date],.f input[type=time],.f select,.f textarea{width:100%;border:1px solid var(--g200);border-radius:8px;padding:5px 8px;background:#fff;min-height:32px}
.f textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--g200);font-size:12px;color:var(--g700);background:#fff}
.tag.on{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#fff;font-weight:700}
.err{color:var(--red);font-size:12px;margin-top:4px}
.scope{background:var(--blue50);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:12px}
.scope label{display:block;padding:2px 0;cursor:pointer}
.foot{margin-top:14px;font-size:12px;color:var(--g500)}
.danger{margin-top:10px;height:34px;width:100%;border-radius:8px;border:1px solid var(--g200);color:var(--red);font-weight:600}
.danger:hover{background:var(--red50)}
.link{height:34px;width:100%;border-radius:8px;background:var(--blue50);color:var(--blue6);font-weight:700;margin-top:8px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:6px 8px;margin:10px 0;font-size:13px}
.kv span{color:var(--g500);font-size:12px}
.note{background:var(--g50);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--g600);margin-top:10px}

/* 창 · 토스트 */
.scrim{position:fixed;inset:0;background:rgba(25,31,40,.4);display:grid;place-items:center;z-index:50}
.dlg{background:#fff;border-radius:16px;width:760px;max-width:92vw;max-height:86vh;overflow:auto;padding:20px 22px}
.dlg h2{margin:0 0 4px;font-size:18px}
.steps{display:flex;gap:8px;margin:10px 0 14px;font-size:12px;color:var(--g500)}
.steps b{color:var(--blue6)}
.dlg table{width:100%;border-collapse:collapse;font-size:12px}
.dlg th,.dlg td{border-bottom:1px solid var(--g200);padding:6px 6px;text-align:left;white-space:nowrap}
.dlg th{color:var(--g500);font-weight:600}
.dlg tr.bad td{background:var(--red50)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dropzone{border:2px dashed var(--g300);border-radius:12px;padding:36px;text-align:center;color:var(--g600)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g900);color:#fff;border-radius:10px;padding:10px 16px;z-index:60;font-size:13px}
.proto{position:fixed;left:112px;bottom:1px;font-size:11px;color:var(--g500);background:#fff;border:1px solid var(--g200);border-radius:6px;padding:2px 8px;z-index:4}
</style>

/* ───────── 날짜 도우미 ───────── */
function dstr(d){return D(d.getFullYear(),d.getMonth()+1,d.getDate())}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function add(s,n){const d=pd(s);d.setDate(d.getDate()+n);return dstr(d)}
function dow(s){return pd(s).getDay()} /* 0=일 */
function iso(s){const w=dow(s);return w===0?7:w}
const DOW=['일','월','화','수','목','금','토'];
function label(s){const d=pd(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`}
function mins(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function hm(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const cat=id=>CATS.find(c=>c.id===id), cls=id=>CLASSES.find(c=>c.id===id), res=id=>RES.find(r=>r.id===id);

/* ───────── 반복 펼치기 (명세 7-3) ───────── */
function occursOn(e,day){
  if(day<e.date) return false;
  const r=e.repeat;
  if(!r){ return day<= (e.endDate||e.date); }
  if(r.until && day>r.until) return false;
  const diff=Math.round((pd(day)-pd(e.date))/864e5), iv=r.interval||1;
  if(r.freq==='daily') return diff%iv===0;
  if(r.freq==='weekly'){
    const wk=Math.floor((diff+iso(e.date)-1)/7);
    return wk%iv===0 && (r.weekdays&&r.weekdays.length?r.weekdays:[iso(e.date)]).includes(iso(day));
  }
  if(r.freq==='monthly'){
    const a=pd(e.date),b=pd(day); if(a.getDate()!==b.getDate()) return false;
    return ((b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth())%iv===0;
  }
  return false;
}
function occ(e,day){ /* 그 날짜의 한 회차 (예외 반영) */
  if(!occursOn(e,day)) return null;
  const x=(e.exceptions||[]).find(x=>x.date===day);
  const o={...e,...(x||{}),date:day,base:e,ex:x||null};
  o.cancelled = !!e.cancelledAt || !!(x&&x.cancelled);
  return o;
}
function classOk(ids){ return !ids||!ids.length || ids.some(id=>!S.off.has('cls:'+id)); }
function visible(o){
  if(o.cancelled && !S.showCancelled) return false;
  if(S.resident){ const r=res(S.resident);
    if(o.residentId) return o.residentId===r.id;
    return !o.classIds.length || o.classIds.includes(r.cls);
  }
  if(S.off.has('cat:'+o.cat)) return false;
  return classOk(o.classIds);
}
function eventsOn(day,{all=false}={}){
  const out=[];
  for(const e of EVENTS){ const o=occ(e,day); if(o && (all||visible(o))) out.push(o); }
  return out.sort((a,b)=>(a.time||'')<(b.time||'')?-1:1);
}
function autosOn(day,{all=false}={}){
  return AUTO_ITEMS.filter(a=>{
    const end = a.kind==='case' ? (a.endDate||dstr(NOW)) : a.date;
    if(day<a.date||day>end) return false;
    if(all) return true;
    if(S.resident) return a.res===S.resident;
    return !S.off.has('auto:'+a.kind) && !S.off.has('cls:'+res(a.res).cls);
  });
}

function gridHtml(days){
  const H0=6,H1=22, cols=`52px repeat(${days.length},1fr)`;
  let head=`<div class="tg-head" style="grid-template-columns:${cols}"><div></div>${days.map(s=>`<div class="dh ${s===dstr(NOW)?'today':''}" data-day="${s}">${DOW[dow(s)]}<b>${pd(s).getDate()}</b>${HOLIDAYS[s]?` <span style="color:var(--red)">${HOLIDAYS[s]}</span>`:''}</div>`).join('')}
    <div class="gut">종일</div>${days.map(s=>{
      const ad=[...autosOn(s).filter(a=>a.kind==='case'||!a.time).map(a=>autoChip(a,s)),...eventsOn(s).filter(o=>!o.time).map(chipHtml)];
      return `<div class="ad" data-cell="${s}">${ad.join('')}${S.quick&&S.quick.date===s&&!S.quick.time?`<input class="quick" placeholder="새 일정 제목 · Enter" aria-label="새 일정 제목">`:''}</div>`}).join('')}</div>`;
  let gut=''; for(let h=H0;h<=H1;h++) gut+=`<span style="top:${(h-H0)*44}px">${String(h).padStart(2,'0')}:00</span>`;
  const shiftOn=!S.off.has('auto:shift')&&!S.resident;
  let body=`<div class="tg" style="grid-template-columns:${cols};height:${(H1-H0)*44}px"><div class="gut">${gut}</div>`;
  for(const s of days){
    let inner='';
    if(shiftOn) for(const sh of SHIFTS){ const a=Math.max(sh.s,H0),b=Math.min(sh.e,H1); if(b>a) inner+=`<div class="shift" style="top:${(a-H0)*44}px;height:${(b-a)*44}px;background:${sh.c};border-top:1px dashed var(--g300)"><span>${sh.n} ${String(sh.s).padStart(2,'0')}–${String(sh.e%24).padStart(2,'0')}</span></div>`; }
    const items=[];
    for(const o of eventsOn(s).filter(o=>o.time)){ const a=mins(o.time), b=o.endTime?mins(o.endTime):a+60; items.push({a,b,o}); }
    for(const x of autosOn(s).filter(a=>a.time&&a.kind!=='case')){ const a=mins(x.time); items.push({a,b:a+30,x}); }
    items.sort((p,q)=>p.a-q.a||q.b-p.b);
    const lanes=[]; for(const it of items){ let i=lanes.findIndex(end=>end<=it.a); if(i<0){i=lanes.length;lanes.push(0)} lanes[i]=it.b; it.lane=i; }
    for(const it of items){ const n=Math.max(1,...items.filter(o=>o.a<it.b&&it.a<o.b).map(o=>o.lane+1));
      const top=(it.a/60-H0)*44, hgt=Math.max(20,(it.b-it.a)/60*44-2), w=100/n, left=it.lane*w;
      const pos=`top:${top}px;height:${hgt}px;left:calc(${left}% + 2px);width:calc(${w}% - 4px)`;
      if(it.o){ const o=it.o,c=cat(o.cat); const who=o.residentId?res(o.residentId).name:(o.classIds.length?o.classIds.map(i=>cls(i).name).join('·'):'시설 전체');
        const slot=o.tempSlot?` · ${o.tempSlot} ${s<dstr(NOW)||(s===dstr(NOW)&&it.a<NOW.getHours()*60)?'✓ 36.5 평소':'예정'}`:'';
        inner+=`<button class="ev ${o.cat==='routine'?'routine':''} ${o.cancelled?'cancel':''} ${isActive(o)?'active':''}" style="${pos};--c:${c.c};--bg:${c.bg};--ink:${c.ink}" data-ev="${o.base.id}|${o.date}"><b>${esc(o.title)}${slot}${o.base.repeat?' ↻':''}</b><small>${o.time}–${o.endTime||hm(it.b)} · ${who}</small></button>`; }
      else { const x=it.x,k=AUTOS.find(a=>a.id===x.kind); const mark=x.state==='done'?'✓ ':x.state==='late'?'지남 · ':'';
        inner+=`<button class="ev auto ${x.state==='done'?'done':''} ${x.state==='late'?'late':''}" style="${pos};--c:${k.c};--ink:var(--g800)" data-auto="${x.id}"><b>${mark}${esc(x.title)} · ${res(x.res).name}</b><small>${x.time}</small></button>`; }
    }
    if(S.quick&&S.quick.date===s&&S.quick.time){ inner+=`<div style="position:absolute;left:2px;right:2px;top:${(mins(S.quick.time)/60-H0)*44}px"><input class="quick" placeholder="${S.quick.time} 새 일정 제목 · Enter" aria-label="새 일정 제목"></div>`; }
    if(s===dstr(NOW)) inner+=`<div class="now" style="top:${(NOW.getHours()+NOW.getMinutes()/60-H0)*44}px"></div>`;
    body+=`<div class="col" data-col="${s}">${inner}</div>`;
  }
  return head+body+'</div>';
}

const stamp=()=>'2026-11-23 10:20';

function applyEdit(fields){ /* 범위에 따라 저장 */
  const e=EVENTS.find(x=>x.id===S.panel.id), day=S.panel.date;
  if(!e.repeat||S.scope==='all'){ Object.assign(e,fields); touch(e); return; }
  if(S.scope==='one'){ const ok=['time','endTime','title','place','owner','detail']; const f={}; for(const k of ok) if(k in fields) f[k]=fields[k];
    if(!Object.keys(f).length){ toast('반 · 별님 · 반복은 "전체"나 "이후 모두"로만 바꿀 수 있어요'); return; }
    e.exceptions=e.exceptions||[]; let x=e.exceptions.find(x=>x.date===day); if(!x){x={date:day};e.exceptions.push(x)} Object.assign(x,f,{by:'박서연',at:stamp()}); return; }
  const n=splitSeries(e,day); Object.assign(n,fields); touch(n); S.panel={id:n.id,date:n.date}; S.scope='all';
}
function splitSeries(e,day){
  const n={...e,id:'e'+(++seq),date:day,repeat:{...e.repeat},splitFrom:e.id,createdBy:'박서연',createdAt:stamp(),
    exceptions:(e.exceptions||[]).filter(x=>x.date>=day)};
  e.repeat={...e.repeat,until:add(day,-1)}; e.exceptions=(e.exceptions||[]).filter(x=>x.date<day); touch(e); EVENTS.push(n); return n;
}
function cancelEvent(){ const e=EVENTS.find(x=>x.id===S.panel.id), day=S.panel.date;
  if(!e.repeat||S.scope==='all'){ e.cancelledAt=stamp(); e.cancelledBy='박서연'; }
  else if(S.scope==='one'){ e.exceptions=e.exceptions||[]; let x=e.exceptions.find(x=>x.date===day); if(!x){x={date:day};e.exceptions.push(x)} x.cancelled=true;x.by='박서연';x.at=stamp(); }
  else { e.repeat={...e.repeat,until:add(day,-1)}; touch(e); }
  toast('일정을 취소했어요. 기록은 남아 있어요'); S.panel=null; }
function restoreEvent(){ const e=EVENTS.find(x=>x.id===S.panel.id); if(e.cancelledAt){ delete e.cancelledAt; delete e.cancelledBy; }

      <div class="f"><span class="l">범위</span><div>지금 켜 둔 반 · 업무<br><label><input type="checkbox"> 건강 자동 항목도 넣기</label><br><label><input type="checkbox"> 취소한 일정도 넣기</label></div></div>
      <p style="color:var(--g600)">반복 일정은 날짜별로 펼쳐서 나와요. 내보낼 일정 <b>47건</b></p>
      <div class="acts"><button class="pill" data-dlg="">그만두기</button><button class="primary" data-dlg="" data-toast="2026-11 일정.xlsx 파일을 받았어요 (시제품에서는 실제 파일이 없어요)">엑셀로 받기</button></div></div>`; }
  l.appendChild(d); const b=d.querySelector('button,input'); if(b) b.focus();
}

/* ───────── 조작 ───────── */
function go(day){ S.sel=day; S.mini=new Date(pd(day).getFullYear(),pd(day).getMonth(),1); }
function openEvent(id,date,extra={}){ S.panel={id,date,...extra}; S.scope='one'; }
function commitQuick(v){ const q=S.quick; S.quick=null; v=v.trim(); if(!v){ render(); return; }
  const only=CLASSES.filter(c=>!S.off.has('cls:'+c.id)); const p={date:q.date,title:v,classIds:only.length===1?[only[0].id]:[]};
  if(q.time){ p.time=q.time; p.endTime=hm(mins(q.time)+60); }
  if(S.resident){ p.residentId=S.resident; p.classIds=[res(S.resident).cls]; p.remind='30m'; }
  const e=addEvent(p); openEvent(e.id,e.date,{isNew:true}); toast('일정을 넣었어요'); render(); }

document.addEventListener('click',ev=>{
  const t=ev.target, c=s=>t.closest(s); let x;
  if(S.menu && !c('.menu')){ S.menu=false; renderBar(); }
  if(x=c('[data-toast]')) toast(x.dataset.toast);
  if(x=c('[data-dlg]')){ S.dialog=x.dataset.dlg?{kind:x.dataset.dlg,step:1}:null; S.menu=false; render(); return; }
  if(x=c('[data-step]')){ S.dialog.step=+x.dataset.step; renderLayer(); return; }
  if(c('.scrim')){ if(t.classList.contains('scrim')){S.dialog=null;renderLayer();} return; }
  if(x=c('[data-only]')){ const key=x.dataset.only, pre=key.split(':')[0]; const all=pre==='cls'?CLASSES.map(c=>'cls:'+c.id):pre==='cat'?CATS.map(c=>'cat:'+c.id):AUTOS.map(a=>'auto:'+a.id);
    all.forEach(k=>S.off.add(k)); S.off.delete(key); render(); return; }
  if(x=c('[data-tog]')){ const k=x.dataset.tog; S.off.has(k)?S.off.delete(k):S.off.add(k); render(); return; }
  if(c('[data-cancelled]')){ S.showCancelled=!S.showCancelled; render(); return; }
  if(x=c('[data-mini]')){ S.mini=new Date(S.mini.getFullYear(),S.mini.getMonth()+ +x.dataset.mini,1); renderSide(); return; }
  if(x=c('[data-go]')){ go(x.dataset.go); S.query=null; render(); return; }
  if(x=c('[data-res]')){ S.resident=x.dataset.res||null; S.findQ=''; if(S.resident&&S.view==='month') S.view='day'; S._scrolled=false; render(); return; }
  if(c('[data-side]')){ S.sideClosed=!S.sideClosed; render(); return; }
  if(x=c('[data-view]')){ S.view=x.dataset.view; S.query=null; S._scrolled=false; render(); return; }
  if(c('[data-today]')){ go(dstr(NOW)); S.query=null; render(); return; }
  if(x=c('[data-move]')){ const n=+x.dataset.move; if(S.view==='month'){ const d=pd(S.sel); go(dstr(new Date(d.getFullYear(),d.getMonth()+n,1))); } else go(add(S.sel,n*(S.view==='week'?7:1))); render(); return; }
  if(c('[data-menu]')){ S.menu=!S.menu; renderBar(); return; }
  if(c('[data-new]')){ const e=addEvent({date:S.sel,title:'새 일정',classIds:[]}); openEvent(e.id,e.date,{isNew:true,focusTitle:true}); S.query=null; render(); return; }
  if(c('[data-close]')){ S.panel=null; render(); return; }
  if(x=c('[data-book]')){ const r=res(x.dataset.book); const e=addEvent({date:S.sel,time:'14:00',endTime:'15:00',title:'진료 예약',cat:'medical',residentId:r.id,classIds:[r.cls],remind:'30m'}); openEvent(e.id,e.date,{isNew:true,focusTitle:true}); render(); return; }
  if(x=c('[data-auto]')){ if(x.dataset.jump){go(x.dataset.jump);S.query=null} S.panel={auto:x.dataset.auto}; render(); return; }
  if(x=c('[data-ev]')){ const [id,date]=x.dataset.ev.split('|'); if(x.dataset.jump){go(date);S.query=null} openEvent(id,date); render(); return; }
  if(x=c('[data-day]')){ go(x.dataset.day); S.view='day'; S._scrolled=false; render(); return; }
  if(c('[data-cancel]')){ cancelEvent(); render(); return; }
  if(c('[data-restore]')){ restoreEvent(); render(); return; }
  if(x=c('[data-wd]')){ const e=EVENTS.find(v=>v.id===S.panel.id); const w=+x.dataset.wd; let ws=[...(e.repeat.weekdays||[])]; ws=ws.includes(w)?ws.filter(v=>v!==w):[...ws,w].sort(); if(!ws.length) return;
    if(S.scope==='one') S.scope='all'; applyEdit({repeat:{...e.repeat,weekdays:ws}}); render(); return; }
  if(x=c('[data-cls]')){ const e=EVENTS.find(v=>v.id===S.panel.id); if(e.residentId) { toast('별님이 붙어 있으면 반은 그 별님의 반으로 정해져요'); return; }
    let ids=[...e.classIds]; const id=x.dataset.cls; ids=!id?[]:ids.includes(id)?ids.filter(v=>v!==id):[...ids,id]; if(S.scope==='one'&&e.repeat) S.scope='all'; applyEdit({classIds:ids}); render(); return; }
  if(x=c('[data-cat]')){ const e=EVENTS.find(v=>v.id===S.panel.id); if(S.scope==='one'&&e.repeat) S.scope='all'; applyEdit({cat:x.dataset.cat}); render(); return; }
  if(c('.quick')) return;
  if(x=c('[data-cell]')){ go(x.dataset.cell); S.quick={date:x.dataset.cell}; S.panel=null; render(); return; }
  if(x=c('[data-col]')){ const r=x.getBoundingClientRect(); const m=Math.floor(((ev.clientY-r.top)/44+6)*2)*30; go(x.dataset.col); S.quick={date:x.dataset.col,time:hm(Math.min(m,21*60))}; S.panel=null; render(); return; }
});

document.addEventListener('change',ev=>{ const t=ev.target, e=S.panel&&S.panel.id?EVENTS.find(v=>v.id===S.panel.id):null;
  if(t.name==='scope'){ S.scope=t.value; renderPanel(); return; }
  if(!e) return; S.panel.err=null;
  const o=occ(e,S.panel.date)||e;
  if(t.id==='pTitle'){ if(!t.value.trim()){ S.panel.err='제목을 적어 주세요'; renderPanel(); return; } applyEdit({title:t.value.trim()}); }
  if(t.id==='pDate'){ const nd=t.value; if(!nd) return; if(e.endDate&&e.endDate<nd){ S.panel.err='끝나는 날이 시작보다 일러요'; renderPanel(); return; } applyEdit({date:nd}); S.panel.date=nd; go(nd); }
  if(t.id==='pEnd'){ if(t.value&&t.value<e.date){ S.panel.err='끝나는 날이 시작보다 일러요'; renderPanel(); return; } applyEdit({endDate:t.value||undefined}); }
  if(t.id==='pAll'){ applyEdit(t.checked?{time:undefined,endTime:undefined}:{time:'10:00',endTime:'11:00'}); }
  if(t.id==='pTime'||t.id==='pEndT'){ const a=document.getElementById('pTime').value, b=document.getElementById('pEndT').value; if(a&&b&&b<=a){ S.panel.err='끝나는 시각이 시작보다 일러요'; renderPanel(); return; } applyEdit({time:a,endTime:b}); }
  if(t.id==='pRep'){ if(S.scope==='one') S.scope='all'; applyEdit({repeat:t.value?{freq:t.value,interval:1,weekdays:t.value==='weekly'?[iso(e.date)]:undefined,until:e.repeat&&e.repeat.until}:undefined, endDate:t.value?undefined:e.endDate}); }
  if(t.id==='pUntil'){ if(S.scope==='one') S.scope='all'; applyEdit({repeat:{...e.repeat,until:t.value||undefined}}); }
  if(t.id==='pRes'){ if(S.scope==='one'&&e.repeat) S.scope='all'; const r=res(t.value); applyEdit(r?{residentId:r.id,classIds:[r.cls],remind:e.remind||'30m'}:{residentId:undefined}); }
  if(t.id==='pOwner') applyEdit({owner:t.value}); if(t.id==='pPlace') applyEdit({place:t.value}); if(t.id==='pMemo') applyEdit({detail:t.value});
  if(t.id==='pRemind'){ if(S.scope==='one'&&e.repeat) S.scope='all'; applyEdit({remind:t.value||undefined}); }
  render();
});

document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='q'){ S.query=t.value; S.panel=null; renderBoard(); document.querySelector('.bar h1').textContent='검색'; }
  if(t.id==='findIn'){ S.findQ=t.value; renderSide(); const i=document.getElementById('findIn'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
});
document.addEventListener('focusout',ev=>{ if(ev.target.classList&&ev.target.classList.contains('quick')&&S.quick){ const v=ev.target.value; setTimeout(()=>{ if(S.quick) commitQuick(v); },0); } });
document.addEventListener('keydown',ev=>{ const t=ev.target, typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
  if(t.classList.contains('quick')){ if(ev.key==='Enter'){ ev.preventDefault(); commitQuick(t.value); } if(ev.key==='Escape'){ S.quick=null; render(); } return; }
  if(ev.key==='Escape'){ if(S.dialog){S.dialog=null} else if(S.menu){S.menu=false} else if(S.query!==null){S.query=null} else if(S.panel){S.panel=null} else return; render(); return; }
  if(typing) return;
  if(t.matches&&t.matches('.cell')){ const mv={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[ev.key];
    if(mv){ ev.preventDefault(); go(add(S.sel,mv)); render(); const f=document.querySelector(`.cell[data-cell="${S.sel}"]`); if(f) f.focus(); return; }
    if(ev.key==='Enter'){ ev.preventDefault(); S.quick={date:S.sel}; render(); return; } }
  const k=ev.key.toLowerCase(); if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(k==='m'||k==='w'||k==='d'){ S.view={m:'month',w:'week',d:'day'}[k]; S.query=null; S._scrolled=false; render(); }
  if(k==='t'){ go(dstr(NOW)); S.query=null; render(); }
  if(k==='/'){ ev.preventDefault(); document.getElementById('q').focus(); }
});
render();
</script>
